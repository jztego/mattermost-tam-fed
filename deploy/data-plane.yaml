# Local stand-ins for the managed Postgres and S3 the Operator guide expects,
# plus the OpenLDAP image named in the interview brief.
# Lab passwords only. They never leave this cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: mattermost
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: mattermost
type: Opaque
stringData:
  POSTGRES_USER: mmuser
  POSTGRES_PASSWORD: mm-lab-db-pass
  POSTGRES_DB: mattermost
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mattermost
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-auth
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mmuser", "-d", "mattermost"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mattermost
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-auth
  namespace: mattermost
type: Opaque
stringData:
  MINIO_ROOT_USER: mmminio
  MINIO_ROOT_PASSWORD: mm-lab-minio-pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # Official minio/minio left Docker Hub. This Bitnami archive tag is
          # the pullable arm64 build of MinIO 2025.5.24.
          image: bitnamilegacy/minio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-auth
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-auth
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_DEFAULT_BUCKETS
              value: mattermost
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: mattermost
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mattermost
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          # The interview image publishes linux/amd64 only. Pull it first with
          # `docker pull --platform linux/amd64`, then let kube use the local copy.
          image: ghcr.io/rroemhild/docker-test-openldap:master
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10389
              name: ldap
          readinessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: mattermost
spec:
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 10389
      targetPort: ldap
